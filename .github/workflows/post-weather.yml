name: Post Qatar Weather to X

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 9 * * *'
    - cron: '30 14 * * *'
  workflow_dispatch:

jobs:
  post-weather:
    name: Fetch weather & post to X
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Post weather update to X
        run: node post-weather.js
        env:
          X_API_KEY:        ${{ secrets.X_API_KEY }}
          X_API_SECRET:     ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:   ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET:  ${{ secrets.X_ACCESS_SECRET }}
