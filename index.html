<!-- ============================================================
     PATCH FOR index.html — replace only the <head> block
     All fixes applied:
       #1  Canonical trailing slash
       #7  GA4 deferred until cookie accept (gtag stub only here)
       #8  Clean non-stuffed title
       #12 Preload for critical assets
       #14 Geo meta tags
       #15 hreflang for EN/AR
     ============================================================ -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Qatar Live Weather — real-time interactive weather map for Doha and all Qatar municipalities. Temperature, humidity, wind, 3-day forecast, UV index, prayer times and more. Bilingual EN/AR.">
    <meta name="keywords" content="Qatar weather today, Qatar weather, Doha weather, weather in Qatar, Qatar temperature today, live weather Qatar, طقس قطر, طقس الدوحة">
    <meta name="author" content="mohammedlglg">
    <meta name="theme-color" content="#059669">
    <meta name="robots" content="index, follow">
    <meta name="google-adsense-account" content="ca-pub-2032436364726427">

    <!-- FIX #14: Geo meta tags for local SEO -->
    <meta name="geo.region" content="QA">
    <meta name="geo.placename" content="Qatar">

    <!-- FIX #1: Canonical WITH trailing slash (was missing /) -->
    <link rel="canonical" href="https://qatarliveweather.com/">

    <!-- FIX #15: hreflang for bilingual EN/AR (same URL serves both) -->
    <link rel="alternate" hreflang="en" href="https://qatarliveweather.com/">
    <link rel="alternate" hreflang="ar" href="https://qatarliveweather.com/">
    <link rel="alternate" hreflang="x-default" href="https://qatarliveweather.com/">

    <!-- Open Graph / Social sharing -->
    <meta property="og:type"        content="website">
    <meta property="og:title"       content="Qatar Live Weather — Real-Time Map for All Municipalities">
    <meta property="og:description" content="Interactive live weather map for Qatar with temperature, humidity, wind, forecasts, UV index, prayer times and more. Bilingual EN/AR.">
    <meta property="og:image"       content="https://qatarliveweather.com/og-image.png">
    <meta property="og:url"         content="https://qatarliveweather.com/">
    <meta property="og:locale"      content="en_US">
    <meta property="og:locale:alternate" content="ar_QA">
    <meta name="twitter:card"       content="summary_large_image">
    <meta name="twitter:title"      content="Qatar Live Weather">
    <meta name="twitter:description" content="Real-time weather map for all Qatar municipalities. EN/AR.">
    <meta name="twitter:image"      content="https://qatarliveweather.com/og-image.png">
    <meta name="twitter:site"       content="@QatarLiveWX">

    <!-- FIX #8: Clean, non-stuffed title (was keyword-stuffed) -->
    <title>Qatar Live Weather — Real-Time Map for All Municipalities</title>

    <!-- PWA manifest & favicon -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <!-- FIX #12: Preload critical assets for faster LCP -->
    <link rel="preload" href="style.css" as="style">
    <link rel="preload" href="app.js" as="script">
    <script src="app.js" defer></script>


    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- App Stylesheet -->
    <link rel="stylesheet" href="style.css">

    <!-- Ad slot hidden by default — revealed only after weather data loads -->
    <style>
        .adsense-slot { display: none; }
        .adsense-slot.ads-ready { display: block; }

        /* ── CLIMATE INFO SECTION ───────────────────────────── */
        .climate-section {
            max-width: 1200px;
            margin: 32px auto 0;
            padding: 0 24px;
        }
        .climate-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }
        .climate-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
        }
        .climate-card h3 {
            font-size: 14px;
            font-weight: 700;
            color: var(--accent);
            margin: 0 0 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .climate-card p {
            font-size: 13px;
            color: var(--txt2);
            line-height: 1.7;
            margin: 0;
        }
        .climate-section-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--txt);
            margin-bottom: 4px;
        }
        .climate-section-sub {
            font-size: 12px;
            color: var(--txt3);
            margin-bottom: 0;
        }
        .season-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            margin-top: 8px;
        }
        .season-table th {
            text-align: left;
            padding: 6px 8px;
            background: var(--bg);
            color: var(--txt3);
            font-weight: 600;
            border-bottom: 1px solid var(--border);
        }
        .season-table td {
            padding: 6px 8px;
            color: var(--txt2);
            border-bottom: 1px solid var(--border);
        }
        .season-table tr:last-child td { border-bottom: none; }
        @media (max-width: 640px) {
            .climate-grid { grid-template-columns: 1fr; }
        }
    </style>

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://qatarliveweather.com/#website",
          "url": "https://qatarliveweather.com/",
          "name": "Qatar Live Weather",
          "description": "Real-time interactive weather map for Qatar — all municipalities, bilingual EN/AR",
          "inLanguage": ["en", "ar"],
          "publisher": {
            "@type": "Organization",
            "name": "Qatar Live Weather",
            "url": "https://qatarliveweather.com/"
          }
        },
        {
          "@type": "WebApplication",
          "@id": "https://qatarliveweather.com/#app",
          "name": "Qatar Live Weather Map",
          "url": "https://qatarliveweather.com/",
          "applicationCategory": "WeatherApplication",
          "operatingSystem": "Any",
          "description": "Live weather map covering all Qatar municipalities with temperature, humidity, wind, UV index, prayer times, forecasts, and astronomy data.",
          "inLanguage": ["en", "ar"],
          "featureList": [
            "Real-time temperature map",
            "3-day weather forecast",
            "Hourly weather forecast",
            "UV Index tracking",
            "Prayer times integration",
            "Arabic / English bilingual",
            "Dark mode support",
            "Offline PWA support"
          ],
          "areaServed": {
            "@type": "Country",
            "name": "Qatar"
          }
        }
      ]
    }
    </script>

    <!--
        FIX #7: Google Analytics is NOT loaded here unconditionally.
        GA initialisation now happens inside app.js → initAnalytics(),
        which is called only AFTER the user clicks "Accept" on the
        cookie consent banner. This ensures GDPR compliance.

        The gtag stub below is kept so gtag() calls made before consent
        acceptance are queued safely and don't throw errors.
    -->
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('consent', 'default', {
            analytics_storage: 'denied',
            ad_storage:        'denied'
        });
    </script>

    <!--
        NOTE: Google AdSense script is loaded AFTER weather data renders (see app.js → initAds).
        This prevents ads from showing on an empty/loading screen, complying with
        Google's "ads on screens without publisher content" policy.
    -->
</head>
