    <!--
    ═══════════════════════════════════════════════════════════
    GOOGLE ANALYTICS 4 — CONSENT-GATED
    -------------------------------------------------------
    WHY this pattern:
      • gtag() MUST be defined globally or any call to it
        (e.g. from browser extensions or future code) would
        throw a ReferenceError and crash the whole page.
      • We define gtag() immediately so the function always
        exists — but we set 'analytics_storage: denied' so
        NO cookies or tracking data are written until the
        user explicitly accepts via the cookie banner.
      • When the user clicks Accept, app.js calls
        gtag('consent','update',{analytics_storage:'granted'})
        and loads the actual GA library dynamically.
      • This is fully GDPR-compliant: no data leaves the
        browser until consent is given.
    ═══════════════════════════════════════════════════════════
    -->
    <script>
        // Step 1: Always define gtag so nothing crashes.
        window.dataLayer = window.dataLayer || [];
        function gtag(){ dataLayer.push(arguments); }

        // Step 2: Default consent — everything denied.
        gtag('consent', 'default', {
            analytics_storage:    'denied',
            ad_storage:           'denied',
            ad_user_data:         'denied',
            ad_personalization:   'denied',
            wait_for_update:      500
        });

        // Step 3: If user already accepted in a previous visit,
        //         restore consent and load GA immediately.
        if (localStorage.getItem('cookie_consent') === 'accepted') {
            gtag('consent', 'update', {
                analytics_storage:  'granted',
                ad_storage:         'granted',
                ad_user_data:       'granted',
                ad_personalization: 'granted'
            });
            // Dynamically load the GA library
            (function() {
                var s = document.createElement('script');
                s.async = true;
                s.src = 'https://www.googletagmanager.com/gtag/js?id=G-YWEKPB5X90';
                document.head.appendChild(s);
            })();
            gtag('js', new Date());
            gtag('config', 'G-YWEKPB5X90', { anonymize_ip: true });
        }

        // Step 4: Helper called by app.js when user clicks "Accept"
        function enableAnalytics() {
            gtag('consent', 'update', {
                analytics_storage:  'granted',
                ad_storage:         'granted',
                ad_user_data:       'granted',
                ad_personalization: 'granted'
            });
            if (!window._gaLoaded) {
                window._gaLoaded = true;
                var s = document.createElement('script');
                s.async = true;
                s.src = 'https://www.googletagmanager.com/gtag/js?id=G-YWEKPB5X90';
                document.head.appendChild(s);
                gtag('js', new Date());
                gtag('config', 'G-YWEKPB5X90', { anonymize_ip: true });
            }
        }
    </script>
