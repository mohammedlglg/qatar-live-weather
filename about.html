<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="About Qatar Live Weather — a free, bilingual real-time weather map covering all Qatar municipalities. Learn about Qatar's climate, heat safety, UV index, dust events, and seasonal weather patterns.">
    <meta name="robots" content="index, follow">

    <!-- FIX #2: Canonical tag (was missing entirely) -->
    <link rel="canonical" href="https://qatarliveweather.com/about.html">

    <!-- FIX #14: Geo meta tags -->
    <meta name="geo.region" content="QA">
    <meta name="geo.placename" content="Qatar">

    <title>About Qatar Live Weather — Climate Guide, Features &amp; Data Sources</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!--
        No AdSense on this page — it is a static informational page.
        Ads only run on index.html after live weather content has loaded.
    -->
    <style>
        .about-content p { font-size:14px; color:var(--txt2); line-height:1.8; margin-bottom:14px; }
        .about-content h3 { font-size:15px; font-weight:700; color:var(--txt); margin:20px 0 8px; }
        .climate-table { width:100%; border-collapse:collapse; font-size:13px; margin:12px 0 16px; }
        .climate-table th { background:var(--bg); color:var(--txt3); font-weight:700; padding:8px 12px; text-align:left; border-bottom:2px solid var(--border); font-size:12px; text-transform:uppercase; letter-spacing:.4px; }
        .climate-table td { padding:8px 12px; color:var(--txt2); border-bottom:1px solid var(--border); vertical-align:top; }
        .climate-table tr:last-child td { border-bottom:none; }
        .climate-table tr:hover td { background:var(--bg); }
        .tip-box { background:var(--accent-light); border-left:3px solid var(--accent); border-radius:6px; padding:14px 16px; margin:12px 0 16px; }
        .tip-box p { font-size:13px; color:var(--txt); margin:0; line-height:1.7; }
        .tip-box strong { color:var(--accent-dark); }
        .warning-box { background:#fef3c7; border-left:3px solid #f59e0b; border-radius:6px; padding:14px 16px; margin:12px 0 16px; }
        [data-theme="dark"] .warning-box { background:#451a03; }
        .warning-box p { font-size:13px; color:#92400e; margin:0; line-height:1.7; }
        [data-theme="dark"] .warning-box p { color:#fbbf24; }
    </style>
</head>
