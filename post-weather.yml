# ─────────────────────────────────────────────────────────────────
# Qatar Live Weather — Auto-post to X (Twitter)
# ─────────────────────────────────────────────────────────────────
# Schedule  : 3× daily at Doha-friendly times (UTC = Doha − 3h)
#   08:00 AST  → 05:00 UTC  (morning briefing)
#   12:00 AST  → 09:00 UTC  (midday / peak-heat update)
#   17:30 AST  → 14:30 UTC  (evening wrap-up)
#
# Manual run: "Run workflow" button in GitHub → Actions tab
#
# Required secrets (Settings → Secrets → Actions):
#   X_API_KEY        — API key from developer.x.com
#   X_API_SECRET     — API key secret
#   X_ACCESS_TOKEN   — Access token (your account)
#   X_ACCESS_SECRET  — Access token secret
# ─────────────────────────────────────────────────────────────────

name: Post Qatar Weather to X

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 5 * * *'    # 08:00 AM Doha time
    - cron: '0 9 * * *'    # 12:00 PM Doha time
    - cron: '30 14 * * *'  # 05:30 PM Doha time
  workflow_dispatch:        # Allow manual trigger from GitHub UI

jobs:
  post-weather:
    name: Fetch weather & post to X
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # 1. Check out the repository
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Set up Node.js 20 (LTS)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install dependencies (twitter-api-v2)
      - name: Install dependencies
        run: npm ci

      # 4. Run the posting script
      - name: Post weather update to X
        run: node post-weather.js
        env:
          X_API_KEY:        ${{ secrets.X_API_KEY }}
          X_API_SECRET:     ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:   ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET:  ${{ secrets.X_ACCESS_SECRET }}
